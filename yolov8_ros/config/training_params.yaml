# YOLOv8 Training Hyperparameters

# -----------------------------------------------------------------------------
# Task and Mode
# -----------------------------------------------------------------------------
task: detect  # detect, segment, classify, pose
mode: train    # train, val, predict, export, track, benchmark

# -----------------------------------------------------------------------------
# Model and Data
# -----------------------------------------------------------------------------
model: null    # model path
data: null     # data.yaml path
epochs: 1000
patience: 50
batch: 16
imgsz: 640
save: true
save_period: -1
cache: false
device: null   # cuda device, i.e. 0 or 0,1,2,3 or cpu
workers: 8
project: null  # project name
name: null     # experiment name
exist_ok: false

# -----------------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------------
optimizer: 'auto'  # AdamW, SGD, etc. or 'auto'
lr0: 0.01          # initial learning rate
lrf: 0.01          # final learning rate (lr0 * lrf)
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8

# -----------------------------------------------------------------------------
# Augmentation Settings
# -----------------------------------------------------------------------------
hsv_h: 0.015  # image HSV-Hue augmentation (fraction)
hsv_s: 0.7    # image HSV-Saturation augmentation (fraction)
hsv_v: 0.4    # image HSV-Value augmentation (fraction)
degrees: 0.0  # image rotation (+/- deg)
translate: 0.1 # image translation (+/- fraction)
scale: 0.5    # image scale (+/- gain)
shear: 0.0    # image shear (+/- deg)
perspective: 0.0 # image perspective (+/- fraction), range 0-0.001
flipud: 0.0   # image flip up-down (probability)
fliplr: 0.5   # image flip left-right (probability)
mosaic: 1.0   # mosaic augmentation (probability)
mixup: 0.0    # mixup augmentation (probability)
copy_paste: 0.0 # copy-paste augmentation (probability)

# -----------------------------------------------------------------------------
# Loss Function
# -----------------------------------------------------------------------------
box: 7.5      # box loss gain
cls: 0.5      # cls loss gain
dfl: 1.5      # dfl loss gain